paths:
  database: data/article_finder.db
  pdfs: data/pdfs
  inbox_pdfs: data/inbox_pdfs
  job_bundles: data/job_bundles
  ae_outputs: data/ae_outputs
  cache: data/cache
embeddings:
  model: all-MiniLM-L6-v2
  cache_embeddings: true
  batch_size: 32
triage:
  send_to_eater_threshold: 0.7
  review_threshold: 0.4
classification:
  min_score_to_store: 0.25
  top_k_per_facet: 5
citations:
  max_expansion_per_run: 100
  min_corpus_citations: 2
  max_hops: 2
article_eater:
  executable: article_eater
  default_profile: standard
  default_hitl: auto
  timeout_seconds: 600
  max_parallel: 1
ui:
  page_size: 25
  max_search_results: 100
